<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Monitor</title>

  <link
    href="https://cdn.jsdelivr.net/npm/cesium@1.115/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.115/Build/Cesium/Cesium.js"></script>

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020814;
      color: #fff;
    }

    #appHeader {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.75);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    #titleWrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #titleWrap h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    #titleWrap p {
      margin: 0;
      font-size: 12px;
      opacity: 0.8;
    }

    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    #searchInput, button, select {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
    }

    #searchInput {
      width: 240px;
      outline: none;
    }

    button {
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      background: rgba(255,255,255,0.16);
    }

    #rightPanel {
      position: absolute;
      top: 78px;
      right: 16px;
      width: 340px;
      max-height: calc(100vh - 96px);
      overflow: auto;
      z-index: 11;
      background: rgba(5, 10, 20, 0.86);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
    }

    #rightPanel h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .section h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #7cc7ff;
    }

    .feedItem {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
      line-height: 1.4;
    }

    .feedItem strong {
      display: block;
      margin-bottom: 4px;
      color: #fff;
    }

    .small {
      opacity: 0.75;
      font-size: 12px;
    }

    .badgeRow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(124, 199, 255, 0.12);
      border: 1px solid rgba(124, 199, 255, 0.24);
      color: #b7e4ff;
    }

    #statusBar {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 11;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    a {
      color: #8fd1ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .cesium-widget-credits {
      display: none !important;
    }

    @media (max-width: 900px) {
      #appHeader {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      #controls {
        justify-content: stretch;
      }

      #searchInput {
        width: 100%;
      }

      #rightPanel {
        left: 16px;
        right: 16px;
        width: auto;
        top: 130px;
        max-height: 42vh;
      }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="appHeader">
    <div id="titleWrap">
      <h1>World Monitor</h1>
      <p>3D globe • search • earthquakes • weather • public conflict summaries</p>
    </div>

    <div id="controls">
      <input id="searchInput" type="text" placeholder="Search location" />
      <button id="searchBtn">Go</button>
      <button id="resetBtn">Reset View</button>
      <button id="quakesBtn">Reload Quakes</button>
    </div>
  </div>

  <aside id="rightPanel">
    <h2>Region / Event Details</h2>
    <div id="details">
      <div class="feedItem">
        <strong>Welcome</strong>
        Click anywhere on the globe to get coordinates and weather. Use the search box to fly to a city or country.
      </div>
    </div>

    <div class="section">
      <h3>Demo Conflict Regions</h3>
      <div id="conflictFeed"></div>
    </div>

    <div class="section">
      <h3>Recent Earthquakes</h3>
      <div id="quakeFeed"></div>
    </div>
  </aside>

  <div id="statusBar">Loading globe...</div>

  <script>
    const statusBar = document.getElementById("statusBar");
    const details = document.getElementById("details");
    const quakeFeed = document.getElementById("quakeFeed");
    const conflictFeed = document.getElementById("conflictFeed");
    const searchInput = document.getElementById("searchInput");

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      shouldAnimate: true,
      baseLayerPicker: true,
      geocoder: false,
      homeButton: false,
      sceneModePicker: true,
      navigationHelpButton: false,
      fullscreenButton: true,
      infoBox: false,
      selectionIndicator: true
    });

    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.depthTestAgainstTerrain = false;
    viewer.scene.skyAtmosphere.show = true;
    viewer.scene.fog.enabled = true;

    const osmLayer = viewer.imageryLayers.addImageryProvider(
      new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/"
      })
    );
    viewer.imageryLayers.raiseToTop(osmLayer);

    viewer.camera.flyHome(0);
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(-20, 20, 23000000)
    });

    statusBar.textContent = "Globe ready";

    const conflictData = [
      {
        name: "Eastern Europe",
        lat: 49.0,
        lon: 31.0,
        summary: "Public reporting indicates ongoing regional conflict activity and infrastructure impacts.",
        news: "Use reputable reporting for latest developments."
      },
      {
        name: "Middle East",
        lat: 32.0,
        lon: 44.0,
        summary: "Multiple conflict flashpoints and humanitarian concerns are frequently reported publicly.",
        news: "Tap marker for region summary."
      },
      {
        name: "Horn of Africa",
        lat: 11.5,
        lon: 43.0,
        summary: "Public coverage includes instability, displacement, and maritime security concerns.",
        news: "Monitor trusted public sources for updates."
      }
    ];

    function addConflictMarkers() {
      conflictData.forEach((item) => {
        viewer.entities.add({
          name: item.name,
          position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat),
          point: {
            pixelSize: 12,
            color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2
          },
          label: {
            text: item.name,
            font: "14px sans-serif",
            fillColor: Cesium.Color.WHITE,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineWidth: 3,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -18),
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, 12000000.0)
          },
          description: item.summary,
          properties: {
            type: "conflict",
            summary: item.summary,
            news: item.news
          }
        });
      });

      conflictFeed.innerHTML = conflictData.map(item => `
        <div class="feedItem">
          <strong>${item.name}</strong>
          ${item.summary}
        </div>
      `).join("");
    }

    async function loadEarthquakes() {
      quakeFeed.innerHTML = `<div class="feedItem">Loading earthquakes...</div>`;

      try {
        const res = await fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson");
        const data = await res.json();

        const features = data.features.slice(0, 20);

        features.forEach((f) => {
          const [lon, lat, depth] = f.geometry.coordinates;
          const mag = f.properties.mag ?? 0;
          const title = f.properties.title || "Earthquake";
          const color =
            mag >= 5 ? Cesium.Color.RED :
            mag >= 3 ? Cesium.Color.ORANGE :
            Cesium.Color.YELLOW;

          viewer.entities.add({
            name: title,
            position: Cesium.Cartesian3.fromDegrees(lon, lat),
            point: {
              pixelSize: Math.max(6, mag * 3),
              color,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 1
            },
            properties: {
              type: "earthquake",
              mag,
              depth,
              place: f.properties.place || title,
              time: f.properties.time,
              url: f.properties.url || ""
            }
          });
        });

        quakeFeed.innerHTML = features.map((f) => {
          const mag = f.properties.mag ?? "N/A";
          const place = f.properties.place || "Unknown location";
          const time = new Date(f.properties.time).toLocaleString();
          return `
            <div class="feedItem">
              <strong>M ${mag} — ${place}</strong>
              <div class="small">${time}</div>
            </div>
          `;
        }).join("");

        statusBar.textContent = "Earthquakes updated";
      } catch (err) {
        quakeFeed.innerHTML = `<div class="feedItem">Could not load earthquakes right now.</div>`;
        statusBar.textContent = "Earthquake feed failed";
      }
    }

    async function searchLocation() {
      const query = searchInput.value.trim();
      if (!query) return;

      statusBar.textContent = `Searching for "${query}"...`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });
        const data = await res.json();

        if (!data.length) {
          statusBar.textContent = "Location not found";
          details.innerHTML = `
            <div class="feedItem">
              <strong>Search Result</strong>
              No result found for <em>${query}</em>.
            </div>
          `;
          return;
        }

        const place = data[0];
        const lat = parseFloat(place.lat);
        const lon = parseFloat(place.lon);

        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1800000),
          duration: 2.0
        });

        viewer.entities.add({
          name: place.display_name,
          position: Cesium.Cartesian3.fromDegrees(lon, lat),
          billboard: {
            image: "https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/svg/location.svg",
            scale: 0.08,
            color: Cesium.Color.CYAN
          },
          properties: {
            type: "search-result",
            label: place.display_name
          }
        });

        await showWeather(lat, lon, place.display_name);
        statusBar.textContent = `Showing ${place.display_name}`;
      } catch (err) {
        statusBar.textContent = "Search failed";
      }
    }

    async function showWeather(lat, lon, labelText) {
      try {
        const weatherUrl =
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,weather_code&timezone=auto`;

        const res = await fetch(weatherUrl);
        const data = await res.json();
        const current = data.current || {};

        details.innerHTML = `
          <div class="feedItem">
            <strong>${labelText}</strong>
            <div>Latitude: ${lat.toFixed(4)}</div>
            <div>Longitude: ${lon.toFixed(4)}</div>
            <div class="badgeRow">
              <span class="badge">Temp: ${current.temperature_2m ?? "N/A"}°C</span>
              <span class="badge">Wind: ${current.wind_speed_10m ?? "N/A"} km/h</span>
              <span class="badge">Code: ${current.weather_code ?? "N/A"}</span>
            </div>
          </div>
        `;
      } catch (err) {
        details.innerHTML = `
          <div class="feedItem">
            <strong>${labelText}</strong>
            <div>Latitude: ${lat.toFixed(4)}</div>
            <div>Longitude: ${lon.toFixed(4)}</div>
            <div class="small">Weather could not be loaded.</div>
          </div>
        `;
      }
    }

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    handler.setInputAction(async function (click) {
      const pickedObject = viewer.scene.pick(click.position);

      if (Cesium.defined(pickedObject) && pickedObject.id) {
        const entity = pickedObject.id;
        const props = entity.properties;

        if (props && props.type) {
          const type = props.type.getValue();

          if (type === "conflict") {
            details.innerHTML = `
              <div class="feedItem">
                <strong>${entity.name}</strong>
                <div>${props.summary.getValue()}</div>
                <div class="small" style="margin-top:8px;">${props.news.getValue()}</div>
              </div>
            `;
            return;
          }

          if (type === "earthquake") {
            const mag = props.mag.getValue();
            const depth = props.depth.getValue();
            const place = props.place.getValue();
            const time = new Date(props.time.getValue()).toLocaleString();
            const url = props.url.getValue();

            details.innerHTML = `
              <div class="feedItem">
                <strong>${place}</strong>
                <div>Magnitude: ${mag}</div>
                <div>Depth: ${depth} km</div>
                <div class="small">${time}</div>
                ${url ? `<div style="margin-top:8px;"><a href="${url}" target="_blank" rel="noopener noreferrer">USGS Event Page</a></div>` : ""}
              </div>
            `;
            return;
          }
        }
      }

      const earthPosition = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
      if (!earthPosition) return;

      const cartographic = Cesium.Cartographic.fromCartesian(earthPosition);
      const lat = Cesium.Math.toDegrees(cartographic.latitude);
      const lon = Cesium.Math.toDegrees(cartographic.longitude);

      viewer.entities.add({
        position: earthPosition,
        point: {
          pixelSize: 8,
          color: Cesium.Color.CYAN,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 1
        }
      });

      await showWeather(lat, lon, `Clicked Location`);
      statusBar.textContent = `Lat ${lat.toFixed(3)}, Lon ${lon.toFixed(3)}`;
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    document.getElementById("searchBtn").addEventListener("click", searchLocation);
    document.getElementById("resetBtn").addEventListener("click", () => {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-20, 20, 23000000),
        duration: 2.0
      });
    });
    document.getElementById("quakesBtn").addEventListener("click", loadEarthquakes);

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchLocation();
    });

    addConflictMarkers();
    loadEarthquakes();
  </script>
</body>
</html>
